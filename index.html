<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf7">
  <meta name="description" content="一个可爱、清爽的下班倒计时与每日打卡网页。">
  <title>距离下班还有</title>
  <link rel="icon" href="assets/brand-pudding.png?v=6" type="image/png">
  <link rel="stylesheet" href="styles.css?v=13">
</head>
<body data-theme="minimal">
  <!--
    Design assumptions:
    1. 这是个人日常工具，倒计时必须先于所有记录功能被看见。
    2. 数据只保存在当前浏览器，不在页面或仓库中写入任何个人打卡信息。
    3. A / C 两套主题共用同一内容结构，避免主题切换造成使用成本。
    4. 用户提供的角色素材作为状态反馈使用，不作为无意义的背景填充。
  -->
  <div class="page-glow page-glow-one" aria-hidden="true"></div>
  <div class="page-glow page-glow-two" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#main" aria-label="返回倒计时">
        <span class="brand-mark" aria-hidden="true">
          <img src="assets/brand-pudding.png?v=6" alt="" width="47" height="47">
        </span>
        <span>
          <strong>下班倒计时</strong>
          <small>今天也慢慢来</small>
        </span>
      </a>

      <nav class="top-actions" aria-label="页面工具">
        <button class="icon-button theme-button" id="themeButton" type="button" aria-label="切换到轻松治愈主题" title="切换主题">
          <span class="theme-icon" aria-hidden="true">A</span>
          <span class="button-label">清爽</span>
        </button>
        <button class="icon-button calendar-button" id="calendarButton" type="button" aria-label="打开打卡日历" title="打卡日历">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 3v3M17 3v3M4.5 9.5h15M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/>
            <path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/>
          </svg>
          <span class="button-label">记录</span>
        </button>
      </nav>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="heroTitle">
        <div class="hero-copy">
          <div class="eyebrow-row">
            <p class="date-label" id="dateLabel">正在读取日期</p>
            <button class="day-toggle bubble-button" id="bubbleButton" type="button">🫧 泡泡</button>
          </div>

          <div class="headline-wrap">
            <p class="overline" id="overline">距离下班还有</p>
            <h1 id="heroTitle">稳稳度过今天</h1>
          </div>

          <div class="countdown" id="countdown" aria-live="polite" aria-label="距离下班的剩余时间">
            <div class="time-block">
              <strong id="hours">00</strong>
              <span>小时</span>
            </div>
            <span class="time-colon" aria-hidden="true">:</span>
            <div class="time-block">
              <strong id="minutes">00</strong>
              <span>分钟</span>
            </div>
            <span class="time-colon" aria-hidden="true">:</span>
            <div class="time-block">
              <strong id="seconds">00</strong>
              <span>秒</span>
            </div>
          </div>

          <button class="overtime-button" id="overtimeButton" type="button" hidden>还在加班</button>

          <div class="punch-panel" aria-label="今日打卡">
            <div class="punch-actions">
              <button class="punch-button punch-in" id="clockInButton" type="button" aria-label="上班打卡">
                <span class="punch-symbol" aria-hidden="true">上</span>
                <span><strong id="clockInLabel">上班打卡</strong><small id="clockInHint">记录这一刻</small></span>
              </button>
              <button class="punch-button punch-out" id="clockOutButton" type="button" aria-label="下班打卡">
                <span class="punch-symbol" aria-hidden="true">下</span>
                <span><strong>下班打卡</strong><small id="clockOutHint">完成后解锁</small></span>
              </button>
              <button class="punch-button slacking-button" id="slackingButton" type="button" aria-label="开始摸鱼" disabled>
                <span class="punch-symbol" aria-hidden="true">鱼</span>
                <span><strong id="slackingLabel">开始摸鱼</strong><small id="slackingHint">上班后解锁</small></span>
              </button>
            </div>

            <div class="today-summary" id="todaySummary" aria-live="polite">
              <div><span>上班</span><strong id="clockInValue">未打卡</strong></div>
              <div><span>下班</span><strong id="clockOutValue">未打卡</strong></div>
              <div class="status-cell"><span>状态</span><strong id="statusValue">未开始</strong></div>
              <button class="summary-entry slacking-cell" id="slackingSummaryButton" type="button"><span>摸鱼</span><strong id="slackingValue">0 分钟</strong></button>
              <div class="duration-cell"><span>实际工作</span><strong id="durationValue">等待记录</strong></div>
            </div>
          </div>
        </div>

        <aside class="companion" aria-label="今日陪伴角色">
          <div class="speech-bubble" id="speechBubble">准备好就出发吧</div>
          <div class="sticker-stage" id="stickerStage">
            <span class="doodle doodle-star" aria-hidden="true">✦</span>
            <span class="doodle doodle-flower" aria-hidden="true">✿</span>
            <img id="companionImage" src="assets/record-pencil.png" alt="抱着铅笔记录的小动物">
          </div>
        </aside>
      </section>

    </main>

  </div>

  <dialog class="calendar-dialog" id="calendarDialog" aria-labelledby="calendarTitle">
    <div class="dialog-shell">
      <header class="dialog-header">
        <div>
          <p class="dialog-kicker">我的打卡记录</p>
          <h2 id="calendarTitle">本月上班 <span id="monthWorkCount">0</span> 天</h2>
        </div>
        <button class="close-button" id="closeCalendar" type="button" aria-label="关闭日历">×</button>
      </header>

      <div class="calendar-toolbar">
        <button id="prevMonth" type="button" aria-label="上个月">←</button>
        <strong id="calendarMonth">2026 年 7 月</strong>
        <button id="nextMonth" type="button" aria-label="下个月">→</button>
      </div>

      <div class="weekdays" aria-hidden="true">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="打卡月历"></div>

      <div class="selected-day" id="selectedDayPanel">
        <img src="assets/record-pencil.png" alt="记录贴图" loading="lazy" decoding="async">
        <div class="selected-day-content">
          <span id="selectedDateLabel">选择一个日期</span>
          <strong id="selectedDateStatus">查看当天记录</strong>
          <small id="selectedDateTimes">上班与下班时间会显示在这里</small>
          <div class="selected-metrics">
            <small>摸鱼 <b id="selectedSlackingValue">0 分钟</b></small>
            <small>实际工作 <b id="selectedWorkedValue">等待记录</b></small>
            <small>泡泡 <b id="selectedBubbleCount">0 条</b></small>
          </div>
          <div class="selected-actions">
            <button id="editSelectedRecord" type="button">编辑当天记录</button>
            <button id="viewSelectedBubbles" type="button">查看泡泡</button>
          </div>
        </div>
      </div>

      <div class="data-actions">
        <button id="exportButton" type="button">导出备份</button>
        <label class="import-label" for="importInput">导入备份</label>
        <input id="importInput" type="file" accept="application/json,.json">
        <button class="danger-button" id="clearButton" type="button">清空本机数据</button>
      </div>
    </div>
  </dialog>

  <dialog class="record-edit-dialog" id="recordEditDialog" aria-labelledby="recordEditTitle">
    <div class="record-edit-shell">
      <header class="editor-header">
        <div>
          <p class="dialog-kicker">轻松补一补</p>
          <h2 id="recordEditTitle">编辑当天记录</h2>
          <p id="recordEditDate">选择日期</p>
        </div>
        <button class="close-button" id="closeRecordEdit" type="button" aria-label="关闭记录编辑">×</button>
      </header>

      <div class="record-time-grid">
        <label>上班时间<input id="recordClockIn" type="time" step="60"></label>
        <label>下班时间<input id="recordClockOut" type="time" step="60"></label>
        <label>计划下班<input id="recordPlannedEnd" type="time" step="60"></label>
      </div>
      <div class="record-delete-row">
        <button class="quiet-danger" id="deleteClockIn" type="button">删除上班打卡</button>
        <button class="quiet-danger" id="deleteClockOut" type="button">删除下班打卡</button>
      </div>

      <section class="slacking-editor" aria-labelledby="slackingEditorTitle">
        <div class="editor-section-title">
          <div><span>摸鱼记录</span><strong id="slackingEditorTitle">当天的摸鱼小段</strong></div>
          <button id="addSlackingSession" type="button">＋ 补录一段摸鱼</button>
        </div>
        <div id="slackingSessionList" class="session-list"></div>
        <p class="editor-empty" id="slackingEmpty">这一天还没有摸鱼记录</p>
      </section>

      <div class="editor-actions">
        <button id="cancelRecordEdit" type="button">取消</button>
        <button class="save-time-button" id="saveRecordEdit" type="button">保存当天记录</button>
      </div>
    </div>
  </dialog>

  <dialog class="bubble-dialog" id="bubbleDialog" aria-labelledby="bubbleTitle">
    <div class="bubble-shell">
      <header class="editor-header">
        <div>
          <p class="dialog-kicker">🫧 轻轻记一下</p>
          <h2 id="bubbleTitle">今天的泡泡</h2>
          <p id="bubbleDateLabel">今天</p>
        </div>
        <button class="close-button" id="closeBubble" type="button" aria-label="关闭泡泡">×</button>
      </header>
      <label class="bubble-composer">
        <span>新泡泡</span>
        <textarea id="bubbleInput" maxlength="500" placeholder="想吐槽什么就写两句……"></textarea>
      </label>
      <button class="blow-bubble-button" id="addBubble" type="button">吹个泡泡</button>
      <div class="bubble-list" id="bubbleList"></div>
      <p class="editor-empty" id="bubbleEmpty">今天还没有冒泡</p>
    </div>
  </dialog>

  <div class="celebration-layer" id="celebrationLayer" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="load-error" id="loadError" role="alert" hidden>
    <strong>页面刚刚更新，请刷新一下</strong>
    <button type="button" onclick="location.reload()">重新加载</button>
  </div>

  <script>
    window.setTimeout(() => {
      if (document.body.dataset.ready !== "true") document.querySelector("#loadError")?.removeAttribute("hidden");
    }, 4000);
  </script>
  <script src="app.js?v=13"></script>
</body>
</html>
